# THEIA on your own server with your own domain and automatic HTTPS.
#   1. Point your domain's DNS A record at the server's IP address.
#   2. Put your domain in the Caddyfile (replace theia.example.com).
#   3. docker compose up -d --build
services:
  theia:
    build: .
    restart: unless-stopped
    expose: ["8501"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [theia]
volumes:
  caddy_data:
